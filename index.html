<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Dash</title>

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script>
    if (typeof Plotly === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.27.0/plotly.min.js"><\/script>');
    }
  </script>

  <!-- Leaflet CSS & JS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f4f6f8;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1a252f;
      font-size: 1.3rem;
      text-align: center;
    }

    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .panel {
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
    }

    .span-full {
      grid-column: span 2;
    }

    .control-group label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .control-group input {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-weight: bold;
      font-size: 12px;
    }
    .btn:hover { background: #0056b3; }
    .status-msg { font-size: 11px; color: #6c757d; margin-top: 6px; font-style: italic; text-align: center; }

    .player-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .player-btn {
      flex: 1;
      padding: 8px 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      background: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 4px;
    }
    .player-btn:hover { background: #dee2e6; }

    .speed-select {
      padding: 7px 4px;
      border-radius: 4px;
      border: 1px solid #ced4da;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      background: #fff;
    }

    .slider-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .slider-container input { width: 100%; }

    .plot-and-stats {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .plot-box {
      height: 420px;
      width: 100%;
    }

    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 180px;
    }

    .stats-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      padding: 10px;
    }

    .stats-card h4 {
      margin: 0 0 6px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-card.wind h4 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 2px; }
    .stats-card.gust h4 { color: #dc3545; border-bottom: 2px solid #dc3545; padding-bottom: 2px; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .stat-label { color: #6c757d; font-weight: bold; }

    .top-layout {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .map-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .map-hint {
      font-size: 10px;
      color: #6c757d;
      text-align: center;
    }

    .params-col {
      display: flex;
      flex-direction: column;
    }

    #map {
      height: 220px;
      width: 100%;
      border-radius: 6px;
    }

    @media (min-width: 768px) {
      body { padding: 15px; }
      h2 { font-size: 1.5rem; }
      .top-layout { flex-direction: row; align-items: stretch; }
      .map-col { flex: 1; min-width: 0; }
      .params-col { flex: 1; min-width: 0; }
      #map { height: 100%; min-height: 260px; }
      .plot-and-stats { flex-direction: row; align-items: flex-start; }
      .plot-box { flex: 1; }
      .slider-container { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>

  <h2>💨 Wind Dash</h2>

  <div class="grid-container">
    <div class="panel">
      <div class="top-layout">
        <div class="map-col">
          <div id="map"></div>
          <div class="map-hint">Click a nearby station to switch to it.</div>
        </div>

        <div class="params-col">
          <div class="params-grid">

            <div class="control-group span-full">
              <label>Wind Station ID:</label>
              <input type="text" id="windStationId" value="CLKN7">
            </div>

            <div class="control-group">
              <label>End Date & Time (EST/EDT):</label>
              <input type="datetime-local" id="startDate">
            </div>

            <div class="control-group">
              <label>Hours to Plot:</label>
              <input type="number" id="hoursToPlot" value="12" min="1" max="120" step="1">
            </div>

            <div class="control-group">
              <label>Foil Threshold (kts):</label>
              <input type="number" id="foilKt" value="10" min="0" max="100" step="1">
            </div>

            <div class="control-group">
              <label>Windsurf Threshold (kts):</label>
              <input type="number" id="windsurfKt" value="15" min="0" max="100" step="1">
            </div>

          </div>

          <button class="btn" id="fetchBtn" onclick="fetchAndProcessData()">Update</button>
          <div id="statusMsg" class="status-msg">Ready.</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="player-controls">
        <button class="player-btn" onclick="firstFrame()">⏮ First</button>
        <button class="player-btn" onclick="stepFrame(-1)">◀ Rev</button>
        <button class="player-btn" id="playBtn" onclick="togglePlay()">▶ Play</button>
        <button class="player-btn" onclick="stepFrame(1)">Next ▶</button>
        <button class="player-btn" onclick="lastFrame()">Last ⏭</button>

        <select id="speedSelect" class="speed-select" onchange="onSpeedChange()">
          <option value="2000">0.5x</option>
          <option value="1000" selected>1x</option>
          <option value="500">2x</option>
          <option value="250">4x</option>
        </select>
      </div>

      <div class="slider-container">
        <span id="timestampDisplay" style="font-weight: bold; text-align: center; min-width: 180px;">Loading...</span>
        <input type="range" id="timeSlider" min="0" max="0" value="0" oninput="onSliderMove(this.value)">
      </div>

      <div class="plot-and-stats">
        <div id="plotCombined" class="plot-box"></div>

        <div class="stats-container">
          <div class="stats-card wind">
            <h4>Wind Stats</h4>
            <div class="stat-row"><span class="stat-label">Mean:</span><span id="wMean">-</span></div>
            <div class="stat-row"><span class="stat-label">Min:</span><span id="wMin">-</span></div>
            <div class="stat-row"><span class="stat-label">Max:</span><span id="wMax">-</span></div>
            <div class="stat-row"><span class="stat-label">Std Dev:</span><span id="wStd">-</span></div>
            <div class="stat-row"><span class="stat-label">Direction:</span><span id="wDir">-</span></div>
          </div>

          <div class="stats-card gust">
            <h4>Gust Stats</h4>
            <div class="stat-row"><span class="stat-label">Mean:</span><span id="gMean">-</span></div>
            <div class="stat-row"><span class="stat-label">Min:</span><span id="gMin">-</span></div>
            <div class="stat-row"><span class="stat-label">Max:</span><span id="gMax">-</span></div>
            <div class="stat-row"><span class="stat-label">Std Dev:</span><span id="gStd">-</span></div>
            <div class="stat-row"><span class="stat-label">Dir Std:</span><span id="gDirStd">-</span></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* =========================================================================
       CONFIG
       Static values that never change at runtime.
    ========================================================================= */
    const CONFIG = {
      workerUrl: 'https://noaa-wave-proxy.rwnster.workers.dev',
      defaultPlaybackMs: 1000,
      mpsToKnots: 1.94384,
      minGustAxis: 15,          // floor for the radial gust axis so calm periods don't look zoomed-in
      axisPaddingFactor: 1.15,  // headroom above the observed max gust when sizing the radial axis
      mapCenter: [34.622, -76.525],
      mapZoom: 7,
      stationTableUrl: 'https://www.ndbc.noaa.gov/data/stations/station_table.txt',
      nearbyRadiusMiles: 100,
      plotly: { displayModeBar: false, scrollZoom: false, responsive: true },
      colors: {
        gustRange: { fill: 'rgba(220, 53, 69, 0.15)', line: 'rgba(220, 53, 69, 0.4)' },
        gustFan: { fill: 'rgba(255, 127, 14, 0.35)', line: 'rgba(255, 127, 14, 0.8)' },
        gustPeak: '#dc3545',
        windRange: { fill: 'rgba(0, 123, 255, 0.15)', line: 'rgba(0, 123, 255, 0.4)' },
        windFan: { fill: 'rgba(0, 123, 255, 0.35)', line: 'rgba(0, 123, 255, 0.8)' },
        windStem: '#007bff',
        thresholdFoil: '#28a745',
        thresholdWindsurf: '#1b5e20'
      },
      radialGridlines: 4,        // max number of concentric gridlines on the radial axis
      pointLabelOffsetFactor: 0.12 // how far point labels sit beyond their marker, as a fraction of the radial axis
    };

    /* =========================================================================
       STATE
       The single source of truth for what's currently loaded / displayed.
    ========================================================================= */
    const state = {
      frames: [],        // one entry per hourly bucket, oldest first
      frameIdx: 0,
      isPlaying: false,
      playTimer: null,
      maxGustAxis: CONFIG.minGustAxis, // radial axis ceiling, derived from the loaded period
      stationTable: null,  // all NDBC stations with coordinates, fetched once and cached
      stationMarkers: [],  // Leaflet markers currently drawn for the active + nearby stations
      autoEndDate: true    // true until the person edits the End Date & Time field by hand
    };

    let map; // Leaflet map instance, created in initMap()

    /* =========================================================================
       DOM REFERENCES
       Cached once; values are re-read live where needed (e.g. inputs).
    ========================================================================= */
    const dom = {
      windStationId: document.getElementById('windStationId'),
      startDate: document.getElementById('startDate'),
      hoursToPlot: document.getElementById('hoursToPlot'),
      foilKt: document.getElementById('foilKt'),
      windsurfKt: document.getElementById('windsurfKt'),
      statusMsg: document.getElementById('statusMsg'),
      timeSlider: document.getElementById('timeSlider'),
      timestampDisplay: document.getElementById('timestampDisplay'),
      playBtn: document.getElementById('playBtn'),
      speedSelect: document.getElementById('speedSelect'),
      plotEl: document.getElementById('plotCombined'),
      stat: {
        wMean: document.getElementById('wMean'),
        wMin: document.getElementById('wMin'),
        wMax: document.getElementById('wMax'),
        wStd: document.getElementById('wStd'),
        wDir: document.getElementById('wDir'),
        gMean: document.getElementById('gMean'),
        gMin: document.getElementById('gMin'),
        gMax: document.getElementById('gMax'),
        gStd: document.getElementById('gStd'),
        gDirStd: document.getElementById('gDirStd')
      }
    };

    /* =========================================================================
       SETTINGS / TIME HELPERS
    ========================================================================= */
    function getUserSettings() {
      return {
        windStationId: dom.windStationId.value.trim(),
        hoursToPlot: parseFloat(dom.hoursToPlot.value) || 12,
        startDate: dom.startDate.value,
        foilKt: parseFloat(dom.foilKt.value) || 0,
        windsurfKt: parseFloat(dom.windsurfKt.value) || 0
      };
    }

    function buildProxyUrl(targetUrl) {
      return `${CONFIG.workerUrl}?url=${encodeURIComponent(targetUrl)}`;
    }

    function getETDateParts(dateObj, options) {
      const formatter = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', ...options });
      const parts = {};
      formatter.formatToParts(dateObj).forEach(p => { if (p.type !== 'literal') parts[p.type] = p.value; });
      return parts;
    }

    function formatToET(dateObj, { roundToHour = true } = {}) {
      const p = getETDateParts(dateObj, {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short'
      });
      const minute = roundToHour ? '00' : p.minute;
      return `${p.year}-${p.month}-${p.day} ${p.hour}:${minute} ${p.timeZoneName}`;
    }

    function setDefaultStartDate() {
      const p = getETDateParts(new Date(), { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
      dom.startDate.value = `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
    }

    /* =========================================================================
       MAP
    ========================================================================= */
    function initMap() {
      const m = L.map('map').setView(CONFIG.mapCenter, CONFIG.mapZoom);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 13 }).addTo(m);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 13 }).addTo(m);
      return m;
    }

    function haversineMiles(lat1, lon1, lat2, lon2) {
      const toRad = deg => (deg * Math.PI) / 180;
      const earthRadiusMiles = 3958.8;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * earthRadiusMiles * Math.asin(Math.sqrt(a));
    }

    // NDBC's station table is pipe-delimited; the coordinate column looks like
    // "34.738 N 72.503 W (34°44'15" N 72°30'11" W)" — we only need the decimal part.
    function parseStationTable(text) {
      const stations = [];
      for (const line of text.split('\n')) {
        if (!line || line.startsWith('#')) continue;

        const fields = line.split('|');
        if (fields.length < 7) continue;

        const id = fields[0].trim();
        const name = fields[4].trim();
        const match = fields[6] && fields[6].match(/([\d.]+)\s*([NS])\s+([\d.]+)\s*([EW])/);
        if (!id || !match) continue;

        const lat = parseFloat(match[1]) * (match[2] === 'S' ? -1 : 1);
        const lon = parseFloat(match[3]) * (match[4] === 'W' ? -1 : 1);
        if (isNaN(lat) || isNaN(lon)) continue;

        stations.push({ id: id.toUpperCase(), name: name || id.toUpperCase(), lat, lon });
      }
      return stations;
    }

    async function loadStationTable() {
      if (state.stationTable) return state.stationTable;
      const response = await fetch(buildProxyUrl(CONFIG.stationTableUrl));
      if (!response.ok) throw new Error(`HTTP ${response.status} fetching station table`);
      state.stationTable = parseStationTable(await response.text());
      return state.stationTable;
    }

    function clearStationMarkers() {
      state.stationMarkers.forEach(marker => map.removeLayer(marker));
      state.stationMarkers = [];
    }

    function addStationMarker(station, { isActive = false, distanceMiles = null } = {}) {
      const marker = L.circleMarker([station.lat, station.lon], {
        radius: isActive ? 8 : 6,
        color: isActive ? CONFIG.colors.gustPeak : CONFIG.colors.windStem,
        fillColor: isActive ? CONFIG.colors.gustPeak : CONFIG.colors.windStem,
        fillOpacity: isActive ? 0.9 : 0.7,
        weight: isActive ? 2 : 1
      }).addTo(map);

      const distanceLabel = distanceMiles != null ? ` — ${Math.round(distanceMiles)} mi` : '';
      marker.bindPopup(`<strong>${station.name}</strong><br>${station.id}${distanceLabel}`);

      if (!isActive) {
        marker.on('click', () => {
          dom.windStationId.value = station.id;
          fetchAndProcessData();
        });
      }

      state.stationMarkers.push(marker);
    }

    // Draws the active station plus every NDBC station within CONFIG.nearbyRadiusMiles,
    // clickable so the person can switch the active station straight from the map.
    async function updateNearbyStations(rawStationId) {
      try {
        const table = await loadStationTable();
        const activeId = rawStationId.trim().toUpperCase();
        const active = table.find(s => s.id === activeId);
        if (!active) return;

        const nearby = table
          .filter(s => s.id !== active.id)
          .map(s => ({ ...s, distanceMiles: haversineMiles(active.lat, active.lon, s.lat, s.lon) }))
          .filter(s => s.distanceMiles <= CONFIG.nearbyRadiusMiles)
          .sort((a, b) => a.distanceMiles - b.distanceMiles);

        clearStationMarkers();
        addStationMarker(active, { isActive: true });
        nearby.forEach(s => addStationMarker(s, { distanceMiles: s.distanceMiles }));

        const bounds = [[active.lat, active.lon], ...nearby.map(s => [s.lat, s.lon])];
        map.fitBounds(bounds, { padding: [20, 20], maxZoom: 10 });
      } catch (err) {
        console.warn('Could not load nearby NDBC stations:', err);
      }
    }

    /* =========================================================================
       DATA FETCH & PARSE (NOAA NDBC realtime2 format)
    ========================================================================= */
    async function fetchWindData(windStationId) {
      const targetUrl = `https://www.ndbc.noaa.gov/data/realtime2/${windStationId}.txt`;
      const response = await fetch(buildProxyUrl(targetUrl));
      if (!response.ok) throw new Error(`HTTP ${response.status} fetching station ${windStationId}`);
      const text = await response.text();
      return parseNDBCWindFormat(text);
    }

    function parseNDBCWindFormat(text) {
      const records = [];

      for (let line of text.trim().split('\n')) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;

        const parts = line.split(/\s+/);
        if (parts.length < 8) continue;

        const [year, month, day, hour, minute] = parts;
        const wdir = parseFloat(parts[5]);
        const wspd = parseFloat(parts[6]);
        const gst = parseFloat(parts[7]);

        if (isNaN(wdir) || isNaN(wspd)) continue;

        const utcDate = new Date(Date.UTC(year, month - 1, day, hour, minute));
        const wspdKts = wspd * CONFIG.mpsToKnots;
        const gstKts = !isNaN(gst) ? gst * CONFIG.mpsToKnots : wspdKts;

        records.push({
          timestamp: formatToET(utcDate),
          rawDate: utcDate,
          fromDir: wdir,
          speedKts: wspdKts,
          gustKts: gstKts
        });
      }
      return records;
    }

    /* =========================================================================
       STATISTICS
    ========================================================================= */
    function computeStats(vals) {
      if (!vals.length) return { meanVal: 0, minVal: 0, maxVal: 0, stdVal: 0 };
      const meanVal = vals.reduce((a, b) => a + b, 0) / vals.length;
      const variance = vals.reduce((a, b) => a + (b - meanVal) ** 2, 0) / vals.length;
      return {
        meanVal,
        minVal: Math.min(...vals),
        maxVal: Math.max(...vals),
        stdVal: Math.sqrt(variance)
      };
    }

    // Mean & spread of a set of compass directions, handling the 0/360 wraparound.
    function computeCircularStats(dirs) {
      if (!dirs.length) return { meanDir: 0, dirStdDeg: 0 };

      let sumSin = 0, sumCos = 0;
      for (const d of dirs) {
        const rad = (d * Math.PI) / 180;
        sumSin += Math.sin(rad);
        sumCos += Math.cos(rad);
      }

      const meanRad = Math.atan2(sumSin / dirs.length, sumCos / dirs.length);
      let meanDir = (meanRad * 180) / Math.PI;
      if (meanDir < 0) meanDir += 360;

      const meanResultantLength = Math.sqrt(sumSin * sumSin + sumCos * sumCos) / dirs.length;
      const dirStdRad = Math.sqrt(Math.max(0, -2 * Math.log(meanResultantLength)));
      const dirStdDeg = (dirStdRad * 180) / Math.PI;

      return { meanDir, dirStdDeg: isNaN(dirStdDeg) ? 0 : dirStdDeg };
    }

    /* =========================================================================
       FRAME BUILDING
       Turns raw records for a time window into one summarized frame per hour.
    ========================================================================= */
    function groupRecordsByHour(records) {
      const buckets = new Map();
      for (const rec of records) {
        if (!buckets.has(rec.timestamp)) buckets.set(rec.timestamp, []);
        buckets.get(rec.timestamp).push(rec);
      }
      return buckets;
    }

    function buildHourlyFrame(timestamp, records) {
      const speeds = records.map(r => r.speedKts);
      const gusts = records.map(r => r.gustKts);
      const dirs = records.map(r => r.fromDir);

      const windStats = computeStats(speeds);
      const gustStats = computeStats(gusts);
      const { meanDir, dirStdDeg } = computeCircularStats(dirs);

      const hourlyPeakRecord = records.reduce(
        (peak, rec) => (rec.gustKts > peak.gustKts ? rec : peak),
        records[0]
      );

      return {
        timestamp,
        windStats,
        gustStats,
        meanDir,
        dirStdDeg,
        minDir: Math.min(...dirs),
        maxDir: Math.max(...dirs),
        hourlyPeakGust: hourlyPeakRecord.gustKts,
        hourlyPeakGustDir: hourlyPeakRecord.fromDir
      };
    }

    function buildHourlyFrames(records, targetTime) {
      const buckets = groupRecordsByHour(records);
      const targetHourKey = formatToET(new Date(targetTime));

      const frames = [];
      let maxGustInPeriod = CONFIG.minGustAxis;
      let currentFrame = null;

      for (const [timestamp, bucketRecords] of buckets.entries()) {
        const frame = buildHourlyFrame(timestamp, bucketRecords);
        maxGustInPeriod = Math.max(maxGustInPeriod, frame.gustStats.maxVal);

        if (timestamp === targetHourKey) {
          // This bucket covers the hour the window ends in, which may still be in
          // progress. Relabel it with its latest reading's exact time and hold it
          // aside so it always lands as one extra frame after the complete hours,
          // instead of just blending into a generic "HH:00" bucket.
          const latestRecord = bucketRecords.reduce((a, b) => (b.rawDate > a.rawDate ? b : a));
          frame.timestamp = formatToET(latestRecord.rawDate, { roundToHour: false });
          currentFrame = frame;
        } else {
          frames.push(frame);
        }
      }

      if (currentFrame) frames.push(currentFrame);

      return { frames, maxGustAxis: Math.ceil(maxGustInPeriod * CONFIG.axisPaddingFactor) };
    }

    function getTargetTime(settings) {
      return settings.startDate ? new Date(settings.startDate).getTime() : Date.now();
    }

    function filterToWindow(records, settings, targetTime) {
      const windowStartTime = targetTime - settings.hoursToPlot * 60 * 60 * 1000;

      return records
        .filter(r => r.rawDate.getTime() >= windowStartTime && r.rawDate.getTime() <= targetTime)
        .sort((a, b) => a.rawDate - b.rawDate);
    }

    /* =========================================================================
       FETCH -> PROCESS ORCHESTRATION
    ========================================================================= */
    async function fetchAndProcessData() {
      pause();
      if (state.autoEndDate) setDefaultStartDate();
      const settings = getUserSettings();
      updateNearbyStations(settings.windStationId);

      try {
        dom.statusMsg.innerText = `Fetching wind data for ${settings.windStationId}...`;

        const targetTime = getTargetTime(settings);
        const windRecords = await fetchWindData(settings.windStationId);
        const windowed = filterToWindow(windRecords, settings, targetTime);

        if (windowed.length === 0) throw new Error('No wind records found in selected window.');

        const { frames, maxGustAxis } = buildHourlyFrames(windowed, targetTime);
        state.frames = frames;
        state.maxGustAxis = maxGustAxis;
        state.frameIdx = frames.length - 1;

        dom.timeSlider.max = frames.length - 1;
        dom.timeSlider.value = state.frameIdx;

        renderCurrentFrame();
        dom.statusMsg.innerText = `Loaded ${frames.length} hourly frames.`;
      } catch (err) {
        dom.statusMsg.innerText = 'Fetch error.';
        alert('Error fetching wind data: ' + err.message);
      }
    }

    /* =========================================================================
       PLOT TRACE BUILDERS
    ========================================================================= */
    function generateArcTheta(startAngle, endAngle, steps = 30) {
      const diff = endAngle - startAngle;
      const thetas = [];
      for (let i = 0; i <= steps; i++) {
        thetas.push(startAngle + diff * (i / steps));
      }
      return thetas;
    }

    function createWedgeTrace(arcTheta, minVal, maxVal, fillColor, lineColor, label) {
      const arcThetaRev = [...arcTheta].reverse();
      return {
        type: 'scatterpolar', mode: 'lines', fill: 'toself',
        fillcolor: fillColor, line: { color: lineColor, width: 1.5 },
        r: [...arcTheta.map(() => maxVal), ...arcThetaRev.map(() => minVal), maxVal],
        theta: [...arcTheta, ...arcThetaRev, arcTheta[0]],
        name: label, showlegend: false
      };
    }

    function createThresholdRingTrace(radiusVal, labelName, color) {
      const ringThetas = generateArcTheta(0, 360, 60);
      return {
        type: 'scatterpolar',
        mode: 'lines',
        r: ringThetas.map(() => radiusVal),
        theta: ringThetas,
        name: labelName,
        hoverinfo: 'name',
        showlegend: false,
        line: { color, width: 2.5 }
      };
    }

    function buildThresholdTraces(frame, settings) {
      const traces = [];
      if (settings.foilKt > 0 && settings.foilKt <= state.maxGustAxis) {
        traces.push(createThresholdRingTrace(settings.foilKt, `Foil (${settings.foilKt} kts)`, CONFIG.colors.thresholdFoil));
      }
      if (settings.windsurfKt > 0 && settings.windsurfKt <= state.maxGustAxis) {
        traces.push(createThresholdRingTrace(settings.windsurfKt, `Windsurf (${settings.windsurfKt} kts)`, CONFIG.colors.thresholdWindsurf));
      }
      return traces;
    }

    function buildGustTraces(frame) {
      const c = CONFIG.colors;
      const rangeArc = generateArcTheta(frame.minDir, frame.maxDir);
      const fanArc = generateArcTheta(frame.meanDir - frame.dirStdDeg, frame.meanDir + frame.dirStdDeg);

      return [
        createWedgeTrace(rangeArc, frame.gustStats.minVal, frame.gustStats.maxVal, c.gustRange.fill, c.gustRange.line, 'Gust Range'),
        createWedgeTrace(
          fanArc,
          Math.max(0, frame.gustStats.meanVal - frame.gustStats.stdVal),
          frame.gustStats.meanVal + frame.gustStats.stdVal,
          c.gustFan.fill, c.gustFan.line, 'Gust ±1σ Fan'
        )
      ];
    }

    // A small compass-needle icon centered on the origin. Wind direction data is a "from"
    // bearing, so the icon points the opposite way (fromDir + 180) — the direction the
    // wind is actually blowing toward.
    function createWindDirectionIcon(fromDir, color) {
      const toDir = (fromDir + 180) % 360;
      const shaftR = state.maxGustAxis * 0.08;
      const tipR = state.maxGustAxis * 0.18;
      const halfAngleDeg = 6;

      const shaft = {
        type: 'scatterpolar', mode: 'lines',
        r: [shaftR, 0, shaftR], theta: [fromDir, fromDir, toDir],
        line: { color, width: 3 }, hoverinfo: 'none', showlegend: false
      };
      const arrowhead = {
        type: 'scatterpolar', mode: 'lines', fill: 'toself',
        r: [shaftR, tipR, shaftR],
        theta: [toDir - halfAngleDeg, toDir, toDir + halfAngleDeg],
        fillcolor: color, line: { color, width: 0 },
        hoverinfo: 'none', showlegend: false
      };
      return [shaft, arrowhead];
    }

    function buildWindTraces(frame) {
      const c = CONFIG.colors;
      const rangeArc = generateArcTheta(frame.minDir, frame.maxDir);
      const fanArc = generateArcTheta(frame.meanDir - frame.dirStdDeg, frame.meanDir + frame.dirStdDeg);

      return [
        createWedgeTrace(rangeArc, frame.windStats.minVal, frame.windStats.maxVal, c.windRange.fill, c.windRange.line, 'Wind Range'),
        createWedgeTrace(
          fanArc,
          Math.max(0, frame.windStats.meanVal - frame.windStats.stdVal),
          frame.windStats.meanVal + frame.windStats.stdVal,
          c.windFan.fill, c.windFan.line, 'Wind ±1σ Fan'
        ),
        {
          type: 'scatterpolar', mode: 'lines',
          r: [0, frame.windStats.meanVal], theta: [frame.meanDir, frame.meanDir],
          name: 'Wind Mean Vector', hoverinfo: 'none', line: { color: c.windStem, width: 4 },
          showlegend: false
        },
        ...createWindDirectionIcon(frame.meanDir, c.windStem)
      ];
    }

    // A same-colored text label pushed out radially beyond the true (r, theta), so it
    // doesn't crowd the point it belongs to.
    function buildPointLabel(r, theta, color, text, name) {
      const labelOffset = state.maxGustAxis * CONFIG.pointLabelOffsetFactor;
      return {
        type: 'scatterpolar', mode: 'text',
        r: [r + labelOffset], theta: [theta],
        name, text: [text],
        textposition: 'top center',
        textfont: { color, size: 10, weight: 'bold' },
        hoverinfo: 'none', showlegend: false
      };
    }

    // A marker at the true (r, theta) plus a same-colored text label pushed further out
    // radially, so the label doesn't crowd the marker it belongs to.
    function buildPointWithLabel(r, theta, color, text, name) {
      return [
        {
          type: 'scatterpolar', mode: 'markers',
          r: [r], theta: [theta],
          name, hoverinfo: 'text', text: [text],
          marker: { size: 12, color, symbol: 'circle' },
          showlegend: false
        },
        buildPointLabel(r, theta, color, text, name)
      ];
    }

    function buildPeakGustLabel(frame) {
      return buildPointWithLabel(
        frame.hourlyPeakGust, frame.hourlyPeakGustDir,
        CONFIG.colors.gustPeak, `${Math.round(frame.hourlyPeakGust)}kt`,
        'Hourly Peak Gust'
      );
    }

    // Just the label — the wind mean vector line already terminates at this point,
    // so no separate marker "bubble" is drawn here.
    function buildMeanWindLabel(frame) {
      return [buildPointLabel(
        frame.windStats.meanVal, frame.meanDir,
        CONFIG.colors.windStem, `${Math.round(frame.windStats.meanVal)}kt`,
        'Mean Wind Speed'
      )];
    }

    // Plotly's built-in radial tick labels can render upside down depending on where the
    // axis line sits, so we hide them (see buildPolarLayout) and draw our own instead —
    // plain scatterpolar text never gets auto-rotated, so it always stays upright.
    function buildRadialAxisLabels() {
      const axisTheta = 135; // SE — matches where the radial axis line sits
      const steps = CONFIG.radialGridlines;
      const labels = [];
      for (let i = 0; i <= steps; i++) {
        const val = Math.round((state.maxGustAxis / steps) * i);
        labels.push({
          type: 'scatterpolar', mode: 'text',
          r: [val], theta: [axisTheta],
          text: [`${val} kts`],
          textposition: 'middle right',
          textfont: { color: '#6c757d', size: 9 },
          hoverinfo: 'none', showlegend: false
        });
      }
      return labels;
    }

    // Dummy traces whose only job is to render a legend swatch for each category —
    // the real gust/wind traces all opt out of the legend individually.
    function buildLegendSwatches() {
      const c = CONFIG.colors;
      return [
        {
          type: 'scatterpolar', mode: 'lines', r: [0, 0], theta: [0, 0],
          name: 'Gust', hoverinfo: 'none', line: { color: c.gustPeak, width: 4 }
        },
        {
          type: 'scatterpolar', mode: 'lines', r: [0, 0], theta: [0, 0],
          name: 'Wind Speed', hoverinfo: 'none', line: { color: c.windStem, width: 4 }
        }
      ];
    }

    function buildPolarLayout() {
      return {
        polar: {
          angularaxis: {
            direction: 'clockwise', rotation: 90,
            tickmode: 'array', tickvals: [0, 45, 90, 135, 180, 225, 270, 315],
            ticktext: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']
          },
          radialaxis: {
            range: [0, state.maxGustAxis], angle: -225, showgrid: true,
            showticklabels: false, ticks: '', nticks: CONFIG.radialGridlines
          }
        },
        showlegend: true,
        legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: -0.08, font: { size: 11 } },
        margin: { t: 25, b: 45, l: 25, r: 25 }, autosize: true
      };
    }

    /* =========================================================================
       RENDERING
    ========================================================================= */
    function formatKts(val) { return `${val.toFixed(1)} kts`; }
    function formatKtsSpread(val) { return `±${val.toFixed(1)} kts`; }
    function formatDeg(val) { return `${Math.round(val)}°`; }
    function formatDegSpread(val) { return `±${Math.round(val)}°`; }

    function updateStatsPanel(frame) {
      const s = dom.stat;
      s.wMean.innerText = formatKts(frame.windStats.meanVal);
      s.wMin.innerText = formatKts(frame.windStats.minVal);
      s.wMax.innerText = formatKts(frame.windStats.maxVal);
      s.wStd.innerText = formatKtsSpread(frame.windStats.stdVal);
      s.wDir.innerText = formatDeg(frame.meanDir);

      s.gMean.innerText = formatKts(frame.gustStats.meanVal);
      s.gMin.innerText = formatKts(frame.gustStats.minVal);
      s.gMax.innerText = formatKts(frame.gustStats.maxVal);
      s.gStd.innerText = formatKtsSpread(frame.gustStats.stdVal);
      s.gDirStd.innerText = formatDegSpread(frame.dirStdDeg);
    }

    function renderCurrentFrame() {
      if (!state.frames.length) return;

      const settings = getUserSettings();
      const frame = state.frames[state.frameIdx];

      dom.timestampDisplay.innerText = frame.timestamp;
      updateStatsPanel(frame);

      // Layer order matters: threshold rings, then gust (bottom), then wind (on top), then point labels.
      const traces = [
        ...buildThresholdTraces(frame, settings),
        ...buildGustTraces(frame),
        ...buildWindTraces(frame),
        ...buildPeakGustLabel(frame),
        ...buildMeanWindLabel(frame),
        ...buildRadialAxisLabels(),
        ...buildLegendSwatches()
      ];

      Plotly.newPlot(dom.plotEl, traces, buildPolarLayout(), CONFIG.plotly);
    }

    /* =========================================================================
       PLAYBACK CONTROLS
    ========================================================================= */
    function getPlaybackInterval() {
      return dom.speedSelect ? parseInt(dom.speedSelect.value) : CONFIG.defaultPlaybackMs;
    }

    function goToFrame(idx) {
      state.frameIdx = Math.max(0, Math.min(state.frames.length - 1, idx));
      dom.timeSlider.value = state.frameIdx;
      renderCurrentFrame();
    }

    function togglePlay() { state.isPlaying ? pause() : play(); }

    function play() {
      state.isPlaying = true;
      dom.playBtn.innerText = '⏸ Pause';
      if (state.playTimer) clearInterval(state.playTimer);

      state.playTimer = setInterval(() => {
        const nextIdx = state.frameIdx >= state.frames.length - 1 ? 0 : state.frameIdx + 1;
        goToFrame(nextIdx);
      }, getPlaybackInterval());
    }

    function pause() {
      state.isPlaying = false;
      dom.playBtn.innerText = '▶ Play';
      if (state.playTimer) clearInterval(state.playTimer);
    }

    function onSpeedChange() { if (state.isPlaying) play(); }

    function stepFrame(dir) {
      pause();
      goToFrame(state.frameIdx + dir);
    }

    function firstFrame() {
      pause();
      goToFrame(0);
    }

    function lastFrame() {
      pause();
      goToFrame(state.frames.length - 1);
    }

    function onSliderMove(val) {
      pause();
      goToFrame(parseInt(val));
    }

    /* =========================================================================
       INIT
    ========================================================================= */
    map = initMap();

    // Once the person types their own End Date & Time, stop silently overwriting it
    // with "now" on every fetch — they're deliberately looking at a fixed window.
    dom.startDate.addEventListener('input', () => { state.autoEndDate = false; });

    window.onload = () => {
      fetchAndProcessData();
    };
  </script>
</body>
</html>
