      }
      return labels;
    }

    function buildPolarLayout() {
      return {
        polar: {
          angularaxis: {
            direction: 'clockwise', rotation: 90,
            tickmode: 'array', tickvals: [0, 45, 90, 135, 180, 225, 270, 315],
            ticktext: ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']
          },
          radialaxis: {
            range: [0, state.maxGustAxis], angle: -180, showgrid: true,
            showticklabels: false, ticks: '', nticks: CONFIG.radialGridlines
          }
        },
        showlegend: false,
        // No legend any more, so the old 45px bottom margin is reclaimed. The top/side
        // margins are wider than a bare polar plot needs: they leave room for the peak-gust
        // label, which can sit just outside the outer ring (see buildPointLabel).
        margin: { t: 45, b: 30, l: 40, r: 40 }, autosize: true
      };
    }

    /* =========================================================================
       RENDERING
    ========================================================================= */
    function formatKts(val) { return `${val.toFixed(1)} kts`; }
    function formatKtsMean(meanVal, stdVal) { return `${meanVal.toFixed(1)} ± ${stdVal.toFixed(1)} kts`; }
    function formatDeg(val) { return `${Math.round(val)}°`; }
    function formatDegMean(meanVal, stdVal) { return `${Math.round(meanVal)}° ± ${Math.round(stdVal)}°`; }
    function formatTempF(val) { return (val === null || isNaN(val)) ? '–' : `${Math.round(val)}°F`; }

    // "2026-09-15 14:23 EDT" -> "2:23 PM". The most recent frame can land on a
    // non-":00" minute (see buildHourlyFrames), so this keeps the exact minute
    // rather than always showing an on-the-hour label.
    function formatHourLabel(timestamp) {
      const timePart = timestamp.split(' ')[1] || '';
      const [hhStr, mmStr] = timePart.split(':');
      let hh = parseInt(hhStr, 10);
      const period = hh >= 12 ? 'PM' : 'AM';
      hh = hh % 12;
      if (hh === 0) hh = 12;
      return `${hh}:${mmStr} ${period}`;
    }

    // Compact formats for the hourly table — narrow screens don't have room for
    // units or AM/PM, so these drop everything not needed to read the value.
    function formatTempCompact(val) { return (val === null || isNaN(val)) ? '–' : `${Math.round(val)}`; }
    // "2026-09-15 14:23 EDT" -> "14" — bare 24-hour hour, minutes dropped even for
    // the current (possibly mid-hour) frame.
    function formatHourCompact(timestamp) {
      const timePart = timestamp.split(' ')[1] || '';
      const hhStr = timePart.split(':')[0] || '';
      return hhStr.padStart(2, '0');
    }

    function updateStatsPanel(frame) {
      const s = dom.stat;
      s.wMean.innerText = formatKtsMean(frame.windStats.meanVal, frame.windStats.stdVal);
      s.wDir.innerText = formatDegMean(frame.meanDir, frame.dirStdDeg);
      // Title-bar "20g24": this hour's mean wind (blue) and peak gust (red), whole knots.
      const mean = frame.windStats.meanVal, gust = frame.hourlyPeakGust;
      const hasMean = Number.isFinite(mean), hasGust = Number.isFinite(gust);
      s.wTitleMean.style.color = CONFIG.colors.windStem;
      s.wTitleGust.style.color = CONFIG.colors.gustPeak;
      s.wTitleMean.innerText = hasMean ? Math.round(mean) : '';
      s.wTitleG.innerText = hasMean && hasGust ? 'g' : '';
      s.wTitleGust.innerText = hasGust ? Math.round(gust) : '';
    }

    function renderCurrentFrame() {
      if (!state.frames.length) return;

      const settings = getUserSettings();
      const frame = state.frames[state.frameIdx];

      dom.timestampDisplay.innerText = frame.timestamp;
      updateStatsPanel(frame);

      // Layer order matters: threshold rings, then gust (bottom), then wind (on top), then point labels.
      const traces = [
        ...buildThresholdTraces(frame, settings),
        // Violin mode swaps the gust scatter + wind range wedge for the split violin.
        ...(settings.violin ? buildViolinTraces(frame) : buildGustTraces(frame)),
        ...buildWindTraces(frame, settings),
        ...buildPeakGustLabel(frame),
        ...buildMeanWindLabel(frame),
        ...buildRadialAxisLabels()
      ];

      Plotly.newPlot(dom.plotEl, traces, buildPolarLayout(), CONFIG.plotly);

      renderHourlyTable();
    }

    /* =========================================================================
       HOURLY TABLE
       A meteogram strip below the plot: one column per hourly frame, with the
       active column (the frame currently on the polar plot) boxed in blue.
       Rows: Hour / Dir (mouse-pointer arrow) / a Mean + Peak Gust line plot /
       Temp. After the last observed hour come NWS forecast columns (see NWS FORECAST). Rebuilt in full on every render rather than patched in place - the
       frame count is small enough that this is simpler and plenty fast.
    ========================================================================= */

    // The classic mouse-pointer outline (tip at 0,0, drawn pointing up-left),
    // pre-centered on its bounding box so it can be spun around its middle.
    // POINTER.tipBearing is the compass-style bearing (clockwise from up) the
    // un-rotated shape points at, so pointing it at bearing B means rotating by
    // B - tipBearing.
    const POINTER = (() => {
      const shape = [[0, 0], [0, 16], [3.6, 12.6], [6.2, 18.6], [8.6, 17.6], [6, 11.8], [11, 11.8]];
      const xs = shape.map(p => p[0]), ys = shape.map(p => p[1]);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      return {
        points: shape.map(([x, y]) => `${(x - cx).toFixed(2)},${(y - cy).toFixed(2)}`).join(' '),
        tipBearing: Math.atan2(0 - cx, cy - 0) * 180 / Math.PI
      };
    })();

    // A mouse-pointer arrow centered in its cell, pointing along compass bearing
    // `pointToDir`. Direction only - speed lives in the plot row below it.
    function windPointerSvg(pointToDir, fill = '#333') {
      if (!isFinite(pointToDir)) return '&ndash;';
      const rot = (pointToDir - POINTER.tipBearing).toFixed(1);
      return `<svg class="hb-pointer" viewBox="-14 -14 28 28" width="22" height="22">
        <polygon points="${POINTER.points}" transform="rotate(${rot})" fill="${fill}" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
      </svg>`;
    }

    // 16-point compass name for a bearing: 0 -> N, 22.5 -> NNE, 45 -> NE, ... 337.5 -> NNW.
    const COMPASS_16 = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    function compassPoint(deg) {
      if (!isFinite(deg)) return '';
      return COMPASS_16[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
    }

    // Dir-row cell: the pointer (aimed downwind) with the compass name of where the wind
    // is coming FROM underneath - the usual way wind is named ("NNE wind" blows from NNE).
    function windDirCell(fromDir, fill) {
      if (!isFinite(fromDir)) return '&ndash;';
      return windPointerSvg((fromDir + 180) % 360, fill) +
             `<span class="hb-compass" style="color:${fill || '#333'}">${compassPoint(fromDir)}</span>`;
    }

    // Local (ET) hour-of-day and weekday for an epoch-ms hour. h23 so midnight is 0, not 24.
    const etHourFormatter = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hourCycle: 'h23', hour: '2-digit', weekday: 'short' });
    function etHourInfo(ms) {
      if (!isFinite(ms)) return null;
      const parts = {};
      etHourFormatter.formatToParts(new Date(ms)).forEach(p => { parts[p.type] = p.value; });
      return { hour: parseInt(parts.hour, 10) % 24, weekday: parts.weekday };
    }

    // One <td> spanning every hour column (observed, then forecast), holding a Mean (blue) +
    // Peak Gust (red) line plot in the same colors as the polar plot. Because the table is
    // table-layout:fixed, the N columns are equal width, so hour i sits at exactly
    // (i + 0.5) / N of this cell's width - the SVG's viewBox is N*COL wide with
    // preserveAspectRatio="none" so it stretches to whatever that width is, and
    // every stroke/dot uses vector-effect="non-scaling-stroke" so the stretch
    // can't squash the lines or turn the dots into ovals. Forecast hours continue each line
    // as a solid, lighter-shaded segment (bridged from the last observed point) over a tinted band.
    function buildHourlyPlotCell(frames, fc) {
      const obsN = frames.length;
      const N = obsN + fc.length;
      const H = CONFIG.hourlyTable.plotHeightPx;
      const COL = 100, PAD_TOP = 14, PAD_BOTTOM = 12;   // top pad fits the gust numbers over the highest point; bottom pad leaves room for the "NWS forecast" tag under the 0 line
      const c = CONFIG.colors;
      const finite = v => v !== null && v !== undefined && isFinite(v);

      const means = [...frames.map(f => f.windStats.meanVal), ...fc.map(f => f.meanKts)];
      const gusts = [...frames.map(f => f.hourlyPeakGust), ...fc.map(f => f.gustKts)];
      // HRRR mean for every column, observed hours included, so it can be checked against the buoy.
      // (Only the mean is drawn - an HRRR gust line made the plot too busy. hrrrForHour still
      // returns the gust if it's wanted later.)
      const hMeans = [...frames, ...fc].map(f => hrrrForHour(f.hourStartMs).mean);
      const dataMax = Math.max(0, ...means.filter(finite), ...gusts.filter(finite), ...hMeans.filter(finite));
      const step = [1, 2, 5, 10, 20, 50, 100].find(s => dataMax / s <= 4) || 100;   // <= 4 gridlines
      const yMax = Math.max(step, Math.ceil(dataMax / step) * step);
      const yOf = v => PAD_TOP + (1 - v / yMax) * (H - PAD_TOP - PAD_BOTTOM);
      const xOf = i => (i + 0.5) * COL;

      const ticks = [];
      for (let v = 0; v <= yMax; v += step) ticks.push(v);

      const fmt = p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;
      const pointsOf = (vals, from, to) => {
        const pts = [];
        for (let i = from; i < to; i++) if (finite(vals[i])) pts.push([xOf(i), yOf(vals[i])]);
        return pts;
      };
      const lineSvg = (pts, color, extra = '', width = 2) => pts.length > 1
        ? `<polyline points="${pts.map(fmt).join(' ')}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linejoin="round" vector-effect="non-scaling-stroke" ${extra}/>`
        : '';
      // HRRR mean: dashed, thinner, no dots or numbers - drawn under the observed/NWS lines.
      const hrrrSvg = (vals, color) => lineSvg(pointsOf(vals, 0, N), color, 'stroke-dasharray="5 3" stroke-opacity="0.9"', 1.5);
      // A zero-length segment with round caps = a round dot that ignores the SVG's non-uniform stretch.
      const dotsSvg = (pts, color, size, opacity) => pts.map(p =>
        `<path d="M${fmt(p)} l0.01,0" stroke="${color}" stroke-width="${size}" stroke-linecap="round" stroke-opacity="${opacity}" vector-effect="non-scaling-stroke"/>`
      ).join('');

      const series = (vals, color, forecastColor) => {
        const obs = pointsOf(vals, 0, obsN);
        const ahead = pointsOf(vals, obsN, N);
        let svg = lineSvg(obs, color) + dotsSvg(obs, color, 5, 1);
        if (ahead.length) {
          const bridged = obs.length ? [obs[obs.length - 1], ...ahead] : ahead;   // joins up with the last observed point
          svg += lineSvg(bridged, forecastColor) + dotsSvg(ahead, forecastColor, 5, 1);
        }
        return svg;
      };

      const grid = ticks.map(v =>
        `<line x1="0" x2="${N * COL}" y1="${yOf(v).toFixed(1)}" y2="${yOf(v).toFixed(1)}" stroke="${v === 0 ? '#ced4da' : '#dfe3e8'}" stroke-width="1" vector-effect="non-scaling-stroke"/>`
      ).join('');
      // Whole-knot speed under each blue point (under, not over: the gust line runs above the mean).
      // HTML spans rather than SVG <text>, which the SVG's stretch-to-fit would distort.
      const speedLabels = means.map((v, i) => finite(v)
        ? `<span class="hb-plot-val" style="left:${((i + 0.5) / N * 100).toFixed(3)}%;top:${yOf(v).toFixed(1)}px;color:${c.windStem}">${Math.round(v)}</span>`
        : ''
      ).join('');
      // And whole-knot gust over each red point.
      const gustLabels = gusts.map((v, i) => finite(v)
        ? `<span class="hb-plot-val above" style="left:${((i + 0.5) / N * 100).toFixed(3)}%;top:${yOf(v).toFixed(1)}px;color:${c.gustPeak}">${Math.round(v)}</span>`
        : ''
      ).join('');
      const tickLabels = ticks.map(v =>
        `<span class="hb-plot-tick" style="top:${(yOf(v) / H * 100).toFixed(2)}%">${v}</span>`
      ).join('');

      // Forecast band + the dashed "now" divider, and a dotted line at each midnight (the weekday
      // names themselves live in the Day row above the table's Hour row).
      const band = fc.length
        ? `<rect x="${obsN * COL}" y="0" width="${fc.length * COL}" height="${H}" fill="#f4f6f8"/>` +
          `<line x1="${obsN * COL}" x2="${obsN * COL}" y1="0" y2="${H}" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`
        : '';
      const hourInfo = [...frames.map(f => etHourInfo(f.hourStartMs)), ...fc.map(f => etHourInfo(f.hourStartMs))];
      let midnights = '';
      hourInfo.forEach((info, i) => {
        if (i === 0 || !info || info.hour !== 0) return;
        midnights += `<line x1="${i * COL}" x2="${i * COL}" y1="0" y2="${H}" stroke="#ced4da" stroke-width="1" stroke-dasharray="1 3" vector-effect="non-scaling-stroke"/>`;
      });
      const fcTag = fc.length
        ? `<span class="hb-plot-tag" style="left:calc(${(obsN / N * 100).toFixed(3)}% + 4px)">${state.forecastData ? 'NWS gridded forecast' : 'HRRR forecast'} for ${state.frameStationId}</span>`
        : '';

      return `<td class="hb-plot-cell" colspan="${N}" onclick="hourlyPlotClick(event, ${N}, ${obsN})">
        <div class="hb-plot-box" style="height:${H}px">
          <svg viewBox="0 0 ${N * COL} ${H}" preserveAspectRatio="none" aria-hidden="true">
            ${band}${grid}${midnights}${hrrrSvg(hMeans, c.windStem)}${series(gusts, c.gustPeak, c.gustPeakForecast)}${series(means, c.windStem, c.windStemForecast)}
          </svg>
          ${tickLabels}${speedLabels}${gustLabels}${fcTag}
        </div>
      </td>`;
    }

    // The plot row is one wide cell, so a click is mapped back to an hour column by its
    // horizontal position within the cell. Forecast columns (index >= obsN) have no frame
    // to jump to, so clicks there are ignored.
    function hourlyPlotClick(ev, count, obsCount) {
      const rect = ev.currentTarget.getBoundingClientRect();
      const idx = Math.floor((ev.clientX - rect.left) / rect.width * count);
      if (idx < 0 || idx >= obsCount) return;
      jumpToFrame(idx);
    }

    // The header row of weekday names: one cell per calendar day (ET), spanning that day's hour
    // columns - observed and forecast alike, so a day that straddles "now" is one cell. The name
    // is a sticky child so it stays in view, just right of the row-label column, while a long
    // day is scrolled past.
    function buildDayRow(hourStartMsList) {
      const segments = [];
      hourStartMsList.forEach((ms, i) => {
        const info = etHourInfo(ms);
        if (segments.length && (!info || (info.hour !== 0))) { segments[segments.length - 1].span++; return; }
        segments.push({ weekday: info ? info.weekday : '', span: 1 });
      });
      const stickyLeft = CONFIG.hourlyTable.labelColPx + 3;
      const cells = segments.map((s, k) =>
        `<td colspan="${s.span}" class="hb-day${k ? ' hb-day-start' : ''}">` +
        `<span class="hb-day-label" style="left:${stickyLeft}px">${s.span >= 2 ? s.weekday : s.weekday.charAt(0)}</span></td>`
      ).join('');
      return `<tr class="hb-day-row"><th class="hb-row-label" scope="row"></th>${cells}</tr>`;
    }

    function renderHourlyTable() {
      const frames = state.frames;
      if (!frames.length) { dom.hourlyTable.innerHTML = ''; return; }

      const fc = getForecastColumns();
      const N = frames.length + fc.length;
      const T = CONFIG.hourlyTable;
      // Below this width the table scrolls sideways (see .hourly-table-wrap) instead of squeezing.
      dom.hourlyTable.style.minWidth = `${T.labelColPx + N * T.minColPx}px`;

      const FC_POINTER_FILL = '#8a949e';   // forecast pointers: same shape, lighter than observed
      const ROWS = [
        { label: 'Hour', rowClass: 'hb-hour-row',
          obs: f => formatHourCompact(f.timestamp),
          fc: f => String(etHourInfo(f.hourStartMs).hour).padStart(2, '0') },
        // Points the way the wind is blowing TOWARD, like the polar plot's arrowhead
        // (meanDir is where it's coming FROM). Drop the +180 to point at the source instead.
        { label: 'Dir',
          obs: f => windDirCell(f.meanDir),
          fc: f => windDirCell(f.dirDeg === null ? NaN : f.dirDeg, FC_POINTER_FILL) },
        { plot: true },
        { label: 'Temp',
          obs: f => formatTempCompact(f.atmpF),
          fc: f => formatTempCompact(f.tempF) }
      ];

      let html = `<colgroup><col style="width:${T.labelColPx}px"></colgroup>`;
      html += buildDayRow([...frames.map(f => f.hourStartMs), ...fc.map(f => f.hourStartMs)]);
      ROWS.forEach(row => {
        if (row.plot) {
          html += `<tr><th class="hb-row-label hb-plot-label" scope="row">` +
                  `<span style="color:${CONFIG.colors.gustPeak}">Gust</span><br>` +
                  `<span style="color:${CONFIG.colors.windStem}">Mean</span>` +
                  (state.hrrrData ? `<br><span class="hb-hrrr-key" title="Dashed blue line: HRRR model mean wind, under both observed and forecast hours">HRRR</span>` : '') +
                  `</th>` +
                  `${buildHourlyPlotCell(frames, fc)}</tr>`;
          return;
        }
        html += `<tr class="${row.rowClass || ''}"><th class="hb-row-label" scope="row">${row.label}</th>`;
        frames.forEach((frame, i) => {
          html += `<td onclick="jumpToFrame(${i})">${row.obs(frame)}</td>`;
        });
        fc.forEach((col, k) => {
          html += `<td class="hb-fcst${k === 0 ? ' hb-fcst-start' : ''}">${row.fc(col)}</td>`;
        });
        html += `</tr>`;
      });

      dom.hourlyTable.innerHTML = html;

      // The table's width follows the window, so keep the box glued to its column on resize too.
      if (!hourlyResizeObserver && typeof ResizeObserver !== 'undefined') {
        hourlyResizeObserver = new ResizeObserver(positionHourlyActiveBox);
        hourlyResizeObserver.observe(dom.hourlyTable);
      }
      positionHourlyActiveBox();
      scrollHourlyActiveIntoView();
    }

    let hourlyResizeObserver = null;

    // The active column's cell in the Hour row (+1 skips the row-label <th>).
    function getActiveHourCell() {
      const row = dom.hourlyTable.querySelector('tr.hb-hour-row');
      return row ? row.cells[state.frameIdx + 1] : null;
    }

    // Draws the single blue box over the active hour's column, top to bottom of the whole
    // table, using the column's measured geometry (so it stays exact at fractional widths).
    function positionHourlyActiveBox() {
      const box = dom.hourlyActiveBox;
      const cell = getActiveHourCell();
      if (!cell) { box.style.display = 'none'; return; }
      const inner = box.parentElement.getBoundingClientRect();
      const table = dom.hourlyTable.getBoundingClientRect();
      const c = cell.getBoundingClientRect();
      box.style.left = `${c.left - inner.left}px`;
      box.style.top = `${table.top - inner.top}px`;
      box.style.width = `${c.width}px`;
      box.style.height = `${table.height}px`;
      box.style.display = 'block';
    }

    // Keeps the current hour on screen as playback advances (or the slider moves) by sliding
    // the table so the active column sits in the middle of the visible area, i.e. the part
    // not covered by the sticky label column. Does nothing when the whole table already fits.
    function scrollHourlyActiveIntoView() {
      const wrap = dom.hourlyWrap;
      const cell = getActiveHourCell();
      if (!cell || wrap.scrollWidth <= wrap.clientWidth) return;
      const labelPx = CONFIG.hourlyTable.labelColPx;
      const cellCenter = cell.getBoundingClientRect().left - dom.hourlyActiveBox.parentElement.getBoundingClientRect().left
                         + cell.getBoundingClientRect().width / 2;
      const target = cellCenter - (labelPx + (wrap.clientWidth - labelPx) / 2);
      wrap.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    }

    /* =========================================================================
       PLAYBACK CONTROLS
    ========================================================================= */
    function getPlaybackInterval() {
      return dom.speedSelect ? parseInt(dom.speedSelect.value) : CONFIG.defaultPlaybackMs;
    }

    // Clicking a column in the hourly table jumps straight to that hour, same as
    // scrubbing the slider — and, like scrubbing, stops any active playback.
    function jumpToFrame(idx) {
      pause();
      goToFrame(idx);
    }

    function goToFrame(idx) {
      state.frameIdx = Math.max(0, Math.min(state.frames.length - 1, idx));
      dom.timeSlider.value = state.frameIdx;
      renderCurrentFrame();
    }

    // Button labels for the Play/Pause toggle (same inline-SVG icons as the static buttons).
    const PLAY_BTN_HTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10l9-5z"/></svg> Play';
    const PAUSE_BTN_HTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10"/><rect x="9.5" y="3" width="3" height="10"/></svg> Pause';

    function togglePlay() { state.isPlaying ? pause() : play(); }

    function play() {
      state.isPlaying = true;
      dom.playBtn.innerHTML = PAUSE_BTN_HTML;
      if (state.playTimer) clearInterval(state.playTimer);

      state.playTimer = setInterval(() => {
        const nextIdx = state.frameIdx >= state.frames.length - 1 ? 0 : state.frameIdx + 1;
        goToFrame(nextIdx);
      }, getPlaybackInterval());
    }

    function pause() {
      state.isPlaying = false;
      dom.playBtn.innerHTML = PLAY_BTN_HTML;
      if (state.playTimer) clearInterval(state.playTimer);
    }

    function onSpeedChange() { if (state.isPlaying) play(); }

    function stepFrame(dir) {
      pause();
      goToFrame(state.frameIdx + dir);
    }

    function firstFrame() {
      pause();
      goToFrame(0);
    }

    function lastFrame() {
      pause();
      goToFrame(state.frames.length - 1);
    }

    function onSliderMove(val) {
      pause();
      goToFrame(parseInt(val));
    }

    /* =========================================================================
       GFS 16-DAY OUTLOOK MAP (separate panel, long-range planning only)
       Data: Open-Meteo's GFS point API (api.open-meteo.com/v1/gfs, model gfs_global),
       called straight from the browser - it sends CORS headers and needs no key. It
       returns only the grid points asked for, so the page pulls ONE fixed regional
       grid, not the national model:
         - detail grid (CONFIG.gfs.detail, 0.25 deg = the standard GFS grid): 10 m wind,
           precip and MSL pressure; isobars inside this box are contoured at 1 mb straight
           from these points (no smoothing), so they only show what the grid resolves.
         - pressure grid (CONFIG.gfs.pressure, 1 deg, much wider): MSL pressure for 2 mb
           isobars OUTSIDE the box, drawn lighter - the synoptic picture around it.
       The grids don't depend on the station, so switching stations only recentres the
       map. The processed result is cached in localStorage keyed by the GFS run's
       initialisation time (from Open-Meteo's meta.json), so a reload or Update only
       re-pulls when a new run is out (every 6 h). About 400 locations per pull, well
       inside the free tier (600 calls/min, 10,000/day).
       Frames are every CONFIG.gfs.stepHours (3 h, GFS's native step after day 5);
       precip in each frame is the total over the 3 h ending at that time.
    ========================================================================= */
    const gfs = {
      map: null,
      data: null,          // { run, times[], detail:{lats,lons,precip[f][i],spd[f][i],dir[f][i]}, pressure:{lats,lons,mslp[f][i]} }
      frameIdx: 0,
      playTimer: null,
      layers: { precip: null, isobars: null, isobarsWide: null, labels: null, barbs: null },
      barbMarkers: [],     // one per detail grid point: { marker, i }
      loading: null
    };

    function gfsGridAxes(g) {
      const lats = [], lons = [];
      for (let la = g.latMin; la <= g.latMax + 1e-9; la += g.step) lats.push(+la.toFixed(4));
      for (let lo = g.lonMin; lo <= g.lonMax + 1e-9; lo += g.step) lons.push(+lo.toFixed(4));
      return { lats, lons };   // lats south->north, lons west->east; point i = row*lons.length + col
    }

    async function gfsFetchGrid(grid, hourlyVars, model = CONFIG.gfs.model, days = CONFIG.gfs.forecastDays) {
      const { lats, lons } = gfsGridAxes(grid);
      const la = [], lo = [];
      lats.forEach(y => lons.forEach(x => { la.push(y); lo.push(x); }));
      const url = `${CONFIG.gfs.api}?latitude=${la.join(',')}&longitude=${lo.join(',')}` +
                  `&hourly=${hourlyVars.join(',')}&wind_speed_unit=kn&precipitation_unit=inch` +
                  `&forecast_days=${days}&timezone=GMT&models=${model}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error(`Open-Meteo HTTP ${r.status}`);
      const j = await r.json();
      const arr = Array.isArray(j) ? j : [j];
      if (arr[0] && arr[0].error) throw new Error(arr[0].reason || 'Open-Meteo error');
      return { lats, lons, points: arr };
    }

    async function gfsFetchRunTime(metaUrl = CONFIG.gfs.metaUrl) {
      try {
        const r = await fetch(metaUrl);
        if (!r.ok) return null;
        const m = await r.json();
        return m.last_run_initialisation_time ? m.last_run_initialisation_time * 1000 : null;
      } catch (e) { return null; }
    }

    // Pulls both grids and boils them down to 3-hourly frames starting at the last
    // 3-h step at/before now. Rounded so the cached copy stays small (~0.5 MB).
    async function gfsFetchAll(runMs) {
      const [det, prs] = await Promise.all([
        gfsFetchGrid(CONFIG.gfs.detail, ['precipitation', 'wind_speed_10m', 'wind_direction_10m', 'pressure_msl']),
        gfsFetchGrid(CONFIG.gfs.pressure, ['pressure_msl'])
      ]);
      const hourMs = det.points[0].hourly.time.map(t => Date.parse(t + 'Z'));
      const step = CONFIG.gfs.stepHours;
      const nowMs = Date.now();
      const idx = [];
      hourMs.forEach((t, k) => {
        if (new Date(t).getUTCHours() % step === 0 && t >= nowMs - step * 3600000) idx.push(k);
      });
      const r1 = v => (v === null || v === undefined) ? null : Math.round(v * 10) / 10;
      const precipOf = (h, k) => {        // total over the step hours ending at hour k
        let s = 0, any = false;
        for (let q = k - step + 1; q <= k; q++) {
          const v = q >= 0 ? h.precipitation[q] : null;
          if (v !== null && v !== undefined) { s += v; any = true; }
        }
        return any ? Math.round(s * 100) / 100 : null;
      };
      return {
        run: runMs,
        fetchedAt: nowMs,
        times: idx.map(k => hourMs[k]),
        detail: {
          lats: det.lats, lons: det.lons,
          precip: idx.map(k => det.points.map(p => precipOf(p.hourly, k))),
          spd: idx.map(k => det.points.map(p => r1(p.hourly.wind_speed_10m[k]))),
          dir: idx.map(k => det.points.map(p => { const v = p.hourly.wind_direction_10m[k]; return v === null ? null : Math.round(v); })),
          mslp: idx.map(k => det.points.map(p => r1(p.hourly.pressure_msl[k])))
        },
        pressure: {
          lats: prs.lats, lons: prs.lons,
          mslp: idx.map(k => prs.points.map(p => r1(p.hourly.pressure_msl[k])))
        }
      };
    }

    function gfsReadCache() {
      try { const s = localStorage.getItem(CONFIG.gfs.cacheKey); return s ? JSON.parse(s) : null; }
      catch (e) { return null; }
    }
    function gfsWriteCache(d) {
      try { localStorage.setItem(CONFIG.gfs.cacheKey, JSON.stringify(d)); } catch (e) { /* storage full/blocked - just skip caching */ }
    }

    // Entry point (called at startup and from Update). Cheap meta check first; the big
    // pull only happens when the cached run is stale or missing.
    async function loadGfsOutlook() {
      if (!gfs.map || gfs.loading) return gfs.loading;
      gfs.loading = (async () => {
        const status = document.getElementById('gfsStatus');
        nbmLoad();   // independent of GFS; re-renders the current frame when it lands
        try {
          const runMs = await gfsFetchRunTime();
          let d = gfsReadCache();
          const fresh = d && (runMs ? d.run === runMs : (Date.now() - d.fetchedAt) < CONFIG.gfs.cacheMaxAgeMs);
          if (!fresh) {
            status.innerText = 'Loading GFS forecast...';
            d = await gfsFetchAll(runMs);
            gfsWriteCache(d);
          }
          // Drop frames that have slipped into the past since the pull was cached.
          const cut = Date.now() - CONFIG.gfs.stepHours * 3600000;
          let first = d.times.findIndex(t => t >= cut);
          if (first < 0) first = d.times.length - 1;
          if (first > 0) {
            d.times = d.times.slice(first);
            ['precip', 'spd', 'dir', 'mslp'].forEach(k => { d.detail[k] = d.detail[k].slice(first); });
            d.pressure.mslp = d.pressure.mslp.slice(first);
          }
          const keepIdx = gfs.data ? gfs.frameIdx : 0;
          gfs.data = d;
          gfsBuildBarbMarkers();
          const slider = document.getElementById('gfsSlider');
          slider.max = d.times.length - 1;
          gfsGoTo(Math.min(keepIdx, d.times.length - 1));
          gfsUpdateStatus();
        } catch (err) {
          console.warn('GFS outlook unavailable:', err);
          gfs.gfsError = err.message;
          gfsUpdateStatus();
        } finally {
          gfs.loading = null;
        }
      })();
      return gfs.loading;
    }

    // NBM on the detail grid, boiled down to the same 3-hourly UTC steps as the GFS frames and
    // keyed by frame time, so either model's pull can refresh on its own schedule. Precip =
    // sum of the 3 hourly values ending at the frame; gust = max over the preceding hour
    // (floored at the speed). Cached in localStorage; re-pulled when older than nbm.maxAgeMs.
    async function nbmFetch() {
      const N = CONFIG.gfs.nbm, step = CONFIG.gfs.stepHours;
      const [run, det] = await Promise.all([
        gfsFetchRunTime(N.metaUrl),
        gfsFetchGrid(CONFIG.gfs.detail, ['precipitation', 'wind_speed_10m', 'wind_direction_10m', 'wind_gusts_10m'],
                     N.model, CONFIG.gfs.forecastDays + 1)
      ]);
      const hourMs = det.points[0].hourly.time.map(t => Date.parse(t + 'Z'));
      const r1 = v => (v === null || v === undefined) ? null : Math.round(v * 10) / 10;
      const nowMs = Date.now(), frames = {};
      hourMs.forEach((t, k) => {
        if (new Date(t).getUTCHours() % step !== 0 || t < nowMs - step * 3600000) return;
        const f = { spd: [], dir: [], gust: [], precip: [] };
        let any = false;
        det.points.forEach(p => {
          const h = p.hourly, sp = r1(h.wind_speed_10m[k]), g = r1(h.wind_gusts_10m[k]), d = h.wind_direction_10m[k];
          let pr = 0, prAny = false;
          for (let q = k - step + 1; q <= k; q++) {
            const v = q >= 0 ? h.precipitation[q] : null;
            if (v !== null && v !== undefined) { pr += v; prAny = true; }
          }
          if (sp !== null) any = true;
          f.spd.push(sp);
          f.dir.push(d === null || d === undefined ? null : Math.round(d));
          f.gust.push(g === null || sp === null ? null : Math.max(sp, g));
          f.precip.push(prAny ? Math.round(pr * 100) / 100 : null);
        });
        if (any) frames[t] = f;
      });
      return { run, fetchedAt: nowMs, frames };
    }

    async function nbmLoad() {
      if (gfs.nbmLoading) return gfs.nbmLoading;
      gfs.nbmLoading = (async () => {
        try {
          let n = gfs.nbm;
          if (!n) { try { const c = localStorage.getItem(CONFIG.gfs.nbm.cacheKey); n = c ? JSON.parse(c) : null; } catch (e) { n = null; } }
          if (!n || Date.now() - n.fetchedAt >= CONFIG.gfs.nbm.maxAgeMs) {
            n = await nbmFetch();
            try { localStorage.setItem(CONFIG.gfs.nbm.cacheKey, JSON.stringify(n)); } catch (e) { /* storage full/blocked */ }
          }
          gfs.nbm = n;
          gfs.nbmError = null;
        } catch (err) {
          console.warn('NBM unavailable for the outlook map (GFS only):', err);
          gfs.nbmError = err.message;
        } finally {
          gfs.nbmLoading = null;
          if (gfs.data) gfsGoTo(gfs.frameIdx);
          gfsUpdateStatus();
        }
      })();
      return gfs.nbmLoading;
    }

    function nbmFrame(t) { return gfs.nbm && gfs.nbm.frames[t] ? gfs.nbm.frames[t] : null; }

    function gfsUpdateStatus() {
      const el = document.getElementById('gfsStatus');
      if (!el) return;
      if (!gfs.data) { el.innerText = gfs.gfsError ? `Forecast unavailable (${gfs.gfsError}).` : 'Loading forecast...'; return; }
      const n = gfs.data.times.length, nb = gfs.data.times.filter(t => nbmFrame(t)).length;
      const parts = [];
      if (nb) parts.push(`NBM ${gfs.nbm.run ? gfsFmtRun(gfs.nbm.run) : ''} (${nb} frames)`.replace('  ', ' '));
      else if (gfs.nbmError) parts.push('NBM unavailable');
      else if (gfs.nbmLoading) parts.push('loading NBM...');
      parts.push(`GFS ${gfs.data.run ? gfsFmtRun(gfs.data.run) : ''}${nb < n ? ` (${n - nb} frames)` : ' (isobars)'}`);
      el.innerText = parts.join(' · ') + ` · every ${CONFIG.gfs.stepHours} h`;
    }

    function gfsFmtRun(ms) {
      const d = new Date(ms);
      const hh = String(d.getUTCHours()).padStart(2, '0');
      return `${hh}Z ${d.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'numeric', day: 'numeric' })}`;
    }
    function gfsFmtFrameTime(ms) {
      const s = new Date(ms).toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short', month: 'numeric', day: 'numeric', hour: 'numeric', timeZoneName: 'short' });
      const ahead = Math.round((ms - Date.now()) / 3600000);
      return `${s}  (${ahead >= 0 ? '+' : ''}${ahead} h)`;
    }

    function initGfsMap() {
      if (typeof L === 'undefined') return null;
      const m = L.map('gfsMap', { zoomSnap: 0.5 }).setView(CONFIG.mapCenter, 7);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri · GFS via Open-Meteo', maxZoom: 10
      }).addTo(m);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 10 }).addTo(m);
      // Faint outline of the wind/precip grid, so it's clear where those layers stop.
      const b = CONFIG.gfs.detail, h = b.step / 2;
      L.rectangle([[b.latMin - h, b.lonMin - h], [b.latMax + h, b.lonMax + h]],
        { color: '#6c757d', weight: 1, dashArray: '4 4', fill: false, interactive: false }).addTo(m);
      m.on('zoomend', () => { gfsUpdateBarbVisibility(); gfsRenderIsobars(); });
      m.on('moveend', () => gfsRenderIsobars());
      return m;
    }

    // Called when the wind station changes: recentre only (no new pull). Zoom is set so the
    // Wilmington..Manteo box (CONFIG.gfs.viewBox) fits the panel.
    function centerGfsMap(lat, lon) {
      if (!gfs.map) return;
      const z = Math.min(9, gfs.map.getBoundsZoom(L.latLngBounds(CONFIG.gfs.viewBox)));
      gfs.map.setView([lat, lon], z);
    }

    /* ---- precipitation: value grid -> bilinear upsample -> coloured canvas overlay ---- */
    function gfsPrecipColor(v) {
      const c = CONFIG.gfs.precipColors;
      if (v === null || v < c[0][0]) return null;
      let col = c[0][1];
      for (const [t, hex] of c) if (v >= t) col = hex;
      return col;
    }
    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function gfsRenderPrecip(vals) {
      const { lats, lons } = gfs.data.detail;
      const nx = lons.length, ny = lats.length, S = CONFIG.gfs.precipUpsample;
      const W = nx * S, H = ny * S;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(W, H);
      const at = (c, r) => { const v = vals[r * nx + c]; return v === null ? 0 : v; };
      const rgbCache = {};
      for (let py = 0; py < H; py++) {
        const gy = Math.min(ny - 1, Math.max(0, (H - 1 - py + 0.5) / S - 0.5));   // canvas row 0 = north
        const r0 = Math.floor(gy), r1 = Math.min(ny - 1, r0 + 1), fy = gy - r0;
        for (let px = 0; px < W; px++) {
          const gx = Math.min(nx - 1, Math.max(0, (px + 0.5) / S - 0.5));
          const c0 = Math.floor(gx), c1 = Math.min(nx - 1, c0 + 1), fx = gx - c0;
          const v = (at(c0, r0) * (1 - fx) + at(c1, r0) * fx) * (1 - fy) +
                    (at(c0, r1) * (1 - fx) + at(c1, r1) * fx) * fy;
          const col = gfsPrecipColor(v);
          if (!col) continue;
          const [r, g, b] = rgbCache[col] || (rgbCache[col] = hexToRgb(col));
          const o = (py * W + px) * 4;
          img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 150;
        }
      }
      ctx.putImageData(img, 0, 0);
      const d = CONFIG.gfs.detail, h = d.step / 2;
      const bounds = [[d.latMin - h, d.lonMin - h], [d.latMax + h, d.lonMax + h]];
      const url = cv.toDataURL();
      if (gfs.layers.precip) gfs.layers.precip.setUrl(url);
      else gfs.layers.precip = L.imageOverlay(url, bounds, { opacity: 1, interactive: false }).addTo(gfs.map);
    }

    /* ---- isobars: Catmull-Rom upsample of the 1 deg grid, then marching squares ---- */
    function gfsUpsampleCubic(vals, nx, ny, S) {
      const at = (c, r) => vals[Math.min(ny - 1, Math.max(0, r)) * nx + Math.min(nx - 1, Math.max(0, c))];
      const cr = (p0, p1, p2, p3, t) =>
        p1 + 0.5 * t * (p2 - p0 + t * (2 * p0 - 5 * p1 + 4 * p2 - p3 + t * (3 * (p1 - p2) + p3 - p0)));
      const NX = (nx - 1) * S + 1, NY = (ny - 1) * S + 1;
      const out = new Float64Array(NX * NY);
      for (let Y = 0; Y < NY; Y++) {
        const gy = Y / S, r = Math.min(ny - 2, Math.floor(gy)), ty = gy - r;
        for (let X = 0; X < NX; X++) {
          const gx = X / S, c = Math.min(nx - 2, Math.floor(gx)), tx = gx - c;
          const row = k => cr(at(c - 1, k), at(c, k), at(c + 1, k), at(c + 2, k), tx);
          out[Y * NX + X] = cr(row(r - 1), row(r), row(r + 1), row(r + 2), ty);
        }
      }
      return { vals: out, nx: NX, ny: NY };
    }

    // Segments of the `level` contour through a grid, in grid coordinates [x, y].
    function marchingSquares(g, level) {
      const { vals, nx, ny } = g, segs = [];
      const v = (c, r) => vals[r * nx + c];
      const lerp = (a, b) => (level - a) / (b - a);
      for (let r = 0; r < ny - 1; r++) {
        for (let c = 0; c < nx - 1; c++) {
          const a = v(c, r), b = v(c + 1, r), d = v(c, r + 1), e = v(c + 1, r + 1);   // a=SW b=SE d=NW e=NE
          const code = (a > level ? 1 : 0) | (b > level ? 2 : 0) | (e > level ? 4 : 0) | (d > level ? 8 : 0);
          if (code === 0 || code === 15) continue;
          const S = [c + lerp(a, b), r], E = [c + 1, r + lerp(b, e)], N = [c + lerp(d, e), r + 1], Wp = [c, r + lerp(a, d)];
          const add = (p, q) => segs.push([p, q]);
          switch (code) {
            case 1: case 14: add(Wp, S); break;
            case 2: case 13: add(S, E); break;
            case 3: case 12: add(Wp, E); break;
            case 4: case 11: add(E, N); break;
            case 6: case 9:  add(S, N); break;
            case 7: case 8:  add(Wp, N); break;
            case 5: case 10: {
              const mid = (a + b + d + e) / 4;
              if ((code === 5) === (mid > level)) { add(Wp, N); add(S, E); } else { add(Wp, S); add(E, N); }
              break;
            }
          }
        }
      }
      return segs;
    }

    // Two sets of isobars: 1 mb inside the detail box, contoured straight from the 0.25 deg
    // points; 2 mb outside it from the smoothed 1 deg wide grid (pieces whose midpoint falls
    // inside the box are dropped, so the two sets don't overlap). The dashed rectangle marks
    // the seam. One label per isobar, on the in-view piece nearest the view centre.
    function gfsRenderIsobars() {
      if (!gfs.data || !gfs.map) return;
      const D = CONFIG.gfs.detail, G = CONFIG.gfs.pressure, S = CONFIG.gfs.isobarUpsample;
      const view = gfs.map.getBounds(), ctr = gfs.map.getCenter();
      const h = D.step / 2;
      const inBox = ([la, lo]) => la >= D.latMin - h && la <= D.latMax + h && lo >= D.lonMin - h && lo <= D.lonMax + h;
      const mid = s => [(s[0][0] + s[1][0]) / 2, (s[0][1] + s[1][1]) / 2];
      const contour = (grid, toLL, iv, keepSeg) => {
        let lo = Infinity, hi = -Infinity;
        for (const v of grid.vals) { if (v < lo) lo = v; if (v > hi) hi = v; }
        const lines = [], labels = [];
        for (let lev = Math.ceil(lo / iv) * iv; lev <= hi; lev += iv) {
          const segs = marchingSquares(grid, lev).map(sg => sg.map(toLL)).filter(keepSeg);
          if (!segs.length) continue;
          lines.push(...segs);
          let best = null, bestD = Infinity;
          for (const sg of segs) {
            const m = mid(sg);
            if (!view.contains(m)) continue;
            const dd = (m[0] - ctr.lat) ** 2 + (m[1] - ctr.lng) ** 2;
            if (dd < bestD) { bestD = dd; best = m; }
          }
          if (best) labels.push([best, lev]);
        }
        return { lines, labels };
      };

      let wide = { lines: [], labels: [] }, fine = { lines: [], labels: [] };
      const P = gfs.data.pressure, wv = P.mslp[gfs.frameIdx];
      if (wv && !wv.some(v => v === null)) {
        const up = gfsUpsampleCubic(wv, P.lons.length, P.lats.length, S);
        wide = contour(up, ([x, y]) => [G.latMin + (y / S) * G.step, G.lonMin + (x / S) * G.step],
                       CONFIG.gfs.isobarWideIntervalMb, sg => !inBox(mid(sg)));
      }
      const fv = gfs.data.detail.mslp && gfs.data.detail.mslp[gfs.frameIdx];
      if (fv && !fv.some(v => v === null)) {
        fine = contour({ vals: fv, nx: gfs.data.detail.lons.length, ny: gfs.data.detail.lats.length },
                       ([x, y]) => [D.latMin + y * D.step, D.lonMin + x * D.step],
                       CONFIG.gfs.isobarIntervalMb, () => true);
      }

      ['isobars', 'isobarsWide', 'labels'].forEach(k => { if (gfs.layers[k]) gfs.map.removeLayer(gfs.layers[k]); });
      gfs.layers.isobarsWide = L.polyline(wide.lines, { color: '#6c757d', weight: 1.1, opacity: 0.75, interactive: false }).addTo(gfs.map);
      gfs.layers.isobars = L.polyline(fine.lines, { color: '#343a40', weight: 1.4, opacity: 0.9, interactive: false }).addTo(gfs.map);
      const label = (cls) => ([ll, lev]) => L.marker(ll, {
        interactive: false,
        icon: L.divIcon({ className: cls, html: `<span>${lev}</span>`, iconSize: [30, 12], iconAnchor: [15, 6] })
      });
      gfs.layers.labels = L.layerGroup([
        ...wide.labels.map(label('gfs-isobar-label wide')),
        ...fine.labels.map(label('gfs-isobar-label'))
      ]).addTo(gfs.map);
    }

    /* ---- wind barbs (NWS convention: staff points toward where the wind comes FROM;
       pennant = 50 kt, full barb = 10 kt, half barb = 5 kt; barbs on the clockwise side
       of the staff, slanting toward its outer end; calm (< 2.5 kt) = open circle) ---- */
    function windBarbSvg(speedKts, fromDir, col = '#1a252f') {
      if (speedKts === null || fromDir === null || !isFinite(speedKts)) return '';
      if (speedKts < 2.5) {
        return `<svg width="34" height="34" viewBox="-17 -17 34 34"><circle r="3.5" fill="none" stroke="${col}" stroke-width="1.4"/></svg>`;
      }
      let k = Math.round(speedKts / 5) * 5;
      const len = 15, gap = 3.2, bw = 8, bh = 3.5;   // staff length, spacing along staff, barb reach
      let parts = `<line x1="0" y1="0" x2="0" y2="${-len}"/>`;
      let y = -len;
      while (k >= 50) { parts += `<polygon points="0,${y} ${bw},${y - bh + 1} 0,${y + gap + 0.5}" fill="${col}"/>`; y += gap + 1.5; k -= 50; }
      while (k >= 10) { parts += `<line x1="0" y1="${y}" x2="${bw}" y2="${y - bh}"/>`; y += gap; k -= 10; }
      if (k >= 5) { if (y === -len) y += gap; parts += `<line x1="0" y1="${y}" x2="${bw / 2}" y2="${y - bh / 2}"/>`; }
      return `<svg width="34" height="34" viewBox="-17 -17 34 34"><g transform="rotate(${Math.round(fromDir)})" stroke="${col}" stroke-width="1.4" stroke-linecap="round">` +
             `<circle r="1.6" fill="${col}" stroke="none"/>${parts}</g></svg>`;
    }

    // Outlook map: barb plus a speed label (blue, whole kt; "10g17" with a red gust when one is
    // given) placed on the downwind side of the station dot, clear of the staff and its barbs.
    function gfsBarbHtml(speedKts, gustKts, fromDir, col) {
      const barb = windBarbSvg(speedKts, fromDir, col);
      if (!barb || !CONFIG.gfs.barbLabels) return barb;
      const a = ((fromDir + 180) % 360) * Math.PI / 180, R = 12;
      const x = (R * Math.sin(a)).toFixed(1), y = (-R * Math.cos(a) + 3).toFixed(1);
      const g = (gustKts === null || gustKts === undefined || !isFinite(gustKts)) ? '' :
        `<tspan fill="#6c757d" font-weight="normal">g</tspan><tspan fill="${CONFIG.colors.gustPeak}">${Math.round(gustKts)}</tspan>`;
      // Halo first as its own copy of the whole string, then the coloured text on top with no
      // stroke - stroking each tspan let its white halo paint over the previous character.
      const attrs = `x="${x}" y="${y}" text-anchor="middle" font-size="9" font-weight="bold"`;
      const plain = `${Math.round(speedKts)}${g ? `<tspan font-weight="normal">g</tspan>${Math.round(gustKts)}` : ''}`;
      const label = `<text ${attrs} fill="#fff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">${plain}</text>` +
        `<text ${attrs} fill="${CONFIG.colors.windStem}">${Math.round(speedKts)}${g}</text>`;
      return barb.replace('</svg>', label + '</svg>');
    }

    function gfsBuildBarbMarkers() {
      if (gfs.layers.barbs) gfs.map.removeLayer(gfs.layers.barbs);
      gfs.layers.barbs = L.layerGroup().addTo(gfs.map);
      gfs.barbMarkers = [];
      const { lats, lons } = gfs.data.detail;
      lats.forEach((la, r) => lons.forEach((lo, c) => {
        const marker = L.marker([la, lo], {
          interactive: false, keyboard: false,
          icon: L.divIcon({ className: 'gfs-barb', html: '', iconSize: [34, 34], iconAnchor: [17, 17] })
        });
        gfs.barbMarkers.push({ marker, i: r * lons.length + c, r, c });
      }));
      gfsUpdateBarbVisibility();
    }

    // Thin the barbs so they don't overlap when zoomed out: keep every Nth grid point.
    function gfsUpdateBarbVisibility() {
      if (!gfs.map || !gfs.barbMarkers.length) return;
      const pxPerDeg = 256 * Math.pow(2, gfs.map.getZoom()) / 360;
      const stride = Math.max(1, Math.ceil(CONFIG.gfs.barbMinSpacingPx / (CONFIG.gfs.detail.step * pxPerDeg)));
      gfs.barbMarkers.forEach(b => {
        const show = b.r % stride === 0 && b.c % stride === 0;
        const on = gfs.layers.barbs.hasLayer(b.marker);
        if (show && !on) gfs.layers.barbs.addLayer(b.marker);
        if (!show && on) gfs.layers.barbs.removeLayer(b.marker);
      });
      gfsRenderBarbs();
    }

    function gfsRenderBarbs() {
      if (!gfs.data) return;
      const spd = gfs.data.detail.spd[gfs.frameIdx], dir = gfs.data.detail.dir[gfs.frameIdx];
      const nb = nbmFrame(gfs.data.times[gfs.frameIdx]);
      gfs.barbMarkers.forEach(b => {
        if (!gfs.layers.barbs.hasLayer(b.marker)) return;
        const el = b.marker.getElement();
        if (!el) return;
        if (nb && nb.spd[b.i] !== null && nb.dir[b.i] !== null) {   // NBM barb + "10g17"
          el.innerHTML = gfsBarbHtml(nb.spd[b.i], nb.gust[b.i], nb.dir[b.i]);
        } else {                                                     // GFS barb, speed only
          el.innerHTML = gfsBarbHtml(spd[b.i], null, dir[b.i]);
        }
      });
    }

    function gfsGoTo(idx) {
      if (!gfs.data) return;
      gfs.frameIdx = Math.max(0, Math.min(gfs.data.times.length - 1, idx));
      document.getElementById('gfsSlider').value = gfs.frameIdx;
      const t = gfs.data.times[gfs.frameIdx], nb = nbmFrame(t);
      document.getElementById('gfsTime').innerText = gfsFmtFrameTime(t) + (nb ? ' · NBM' : ' · GFS');
      gfsRenderPrecip(nb ? nb.precip.map((v, i) => v === null ? gfs.data.detail.precip[gfs.frameIdx][i] : v)
                         : gfs.data.detail.precip[gfs.frameIdx]);
      gfsRenderIsobars();
      gfsRenderBarbs();
    }
    function gfsStep(d) { gfsPause(); gfsGoTo(gfs.frameIdx + d); }
    function gfsFirst() { gfsPause(); gfsGoTo(0); }
    function gfsLast() { gfsPause(); if (gfs.data) gfsGoTo(gfs.data.times.length - 1); }
    function gfsPause() {
      if (gfs.playTimer) { clearInterval(gfs.playTimer); gfs.playTimer = null; }
      document.getElementById('gfsPlayBtn').innerHTML = GFS_PLAY_HTML;
    }
    function gfsTogglePlay() {
      if (!gfs.data) return;
      if (gfs.playTimer) { gfsPause(); return; }
      if (gfs.frameIdx >= gfs.data.times.length - 1) gfsGoTo(0);
      document.getElementById('gfsPlayBtn').innerHTML = GFS_PAUSE_HTML;
      gfs.playTimer = setInterval(() => {
        if (gfs.frameIdx >= gfs.data.times.length - 1) { gfsPause(); return; }
        gfsGoTo(gfs.frameIdx + 1);
      }, CONFIG.gfs.frameMs);
    }
    const GFS_PLAY_HTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10l9-5z"/></svg> Play';
    const GFS_PAUSE_HTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="3.5" height="10"/><rect x="9.5" y="3" width="3.5" height="10"/></svg> Pause';

    function buildGfsLegend() {
      const el = document.getElementById('gfsLegend');
      const sw = CONFIG.gfs.precipColors.map(([t, c]) =>
        `<span class="gfs-sw"><i style="background:${c}"></i>${t}</span>`).join('');
      el.innerHTML = `<span class="gfs-leg-title">3-h precip (in):</span>${sw}` +
        `<span class="gfs-leg-note">Isobars: ${CONFIG.gfs.isobarIntervalMb} mb inside the dashed box, ${CONFIG.gfs.isobarWideIntervalMb} mb outside · barbs in kt: NBM wind g gust, GFS speed only; isobars always GFS</span>`;
    }

    /* =========================================================================
       INIT
    ========================================================================= */
    map = initMap();
    gfs.map = initGfsMap();
    buildGfsLegend();

    // Single source of truth for the on-page version tag: CONFIG.version (see the
    // header comment's CHANGELOG for what changed in each version).
    document.getElementById('versionTag').innerText = `v${CONFIG.version}`;

    // Once the person types their own End Date & Time, stop silently overwriting it
    // with "now" on every fetch — they're deliberately looking at a fixed window.
    dom.startDate.addEventListener('input', () => { state.autoEndDate = false; });

    // Violin checkbox redraws right away - no refetch needed.
    dom.violinToggle.addEventListener('change', () => renderCurrentFrame());

    window.onload = () => {
      fetchAndProcessData();
    };
  </script>
</body>
</html>
