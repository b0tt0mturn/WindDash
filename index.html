      if (idx < 0 || idx >= obsCount) return;
      jumpToFrame(idx);
    }

    // The header row of weekday names: one cell per calendar day (ET), spanning that day's hour
    // columns - observed and forecast alike, so a day that straddles "now" is one cell. The name
    // is a sticky child so it stays in view, just right of the row-label column, while a long
    // day is scrolled past.
    function buildDayRow(hourStartMsList) {
      const segments = [];
      hourStartMsList.forEach((ms, i) => {
        const info = etHourInfo(ms);
        if (segments.length && (!info || (info.hour !== 0))) { segments[segments.length - 1].span++; return; }
        segments.push({ weekday: info ? info.weekday : '', span: 1 });
      });
      const stickyLeft = CONFIG.hourlyTable.labelColPx + 3;
      const cells = segments.map((s, k) =>
        `<td colspan="${s.span}" class="hb-day${k ? ' hb-day-start' : ''}">` +
        `<span class="hb-day-label" style="left:${stickyLeft}px">${s.span >= 2 ? s.weekday : s.weekday.charAt(0)}</span></td>`
      ).join('');
      return `<tr class="hb-day-row"><th class="hb-row-label" scope="row"></th>${cells}</tr>`;
    }

    function renderHourlyTable() {
      const frames = state.frames;
      if (!frames.length) { dom.hourlyTable.innerHTML = ''; return; }

      const fc = getForecastColumns();
      const N = frames.length + fc.length;
      const T = CONFIG.hourlyTable;
      // Below this width the table scrolls sideways (see .hourly-table-wrap) instead of squeezing.
      dom.hourlyTable.style.minWidth = `${T.labelColPx + N * T.minColPx}px`;

      const FC_POINTER_FILL = '#8a949e';   // forecast pointers: same shape, lighter than observed
      const ROWS = [
        { label: 'Hour', rowClass: 'hb-hour-row',
          obs: f => formatHourCompact(f.timestamp),
          fc: f => String(etHourInfo(f.hourStartMs).hour).padStart(2, '0') },
        // Points the way the wind is blowing TOWARD, like the polar plot's arrowhead
        // (meanDir is where it's coming FROM). Drop the +180 to point at the source instead.
        { label: 'Dir',
          obs: f => windPointerSvg((f.meanDir + 180) % 360),
          fc: f => windPointerSvg(f.dirDeg === null ? NaN : (f.dirDeg + 180) % 360, FC_POINTER_FILL) },
        { plot: true },
        { label: 'Temp',
          obs: f => formatTempCompact(f.atmpF),
          fc: f => formatTempCompact(f.tempF) }
      ];

      let html = `<colgroup><col style="width:${T.labelColPx}px"></colgroup>`;
      html += buildDayRow([...frames.map(f => f.hourStartMs), ...fc.map(f => f.hourStartMs)]);
      ROWS.forEach(row => {
        if (row.plot) {
          html += `<tr><th class="hb-row-label hb-plot-label" scope="row">` +
                  `<span style="color:${CONFIG.colors.gustPeak}">Gust</span><br>` +
                  `<span style="color:${CONFIG.colors.windStem}">Mean</span></th>` +
                  `${buildHourlyPlotCell(frames, fc)}</tr>`;
          return;
        }
        html += `<tr class="${row.rowClass || ''}"><th class="hb-row-label" scope="row">${row.label}</th>`;
        frames.forEach((frame, i) => {
          html += `<td onclick="jumpToFrame(${i})">${row.obs(frame)}</td>`;
        });
        fc.forEach((col, k) => {
          html += `<td class="hb-fcst${k === 0 ? ' hb-fcst-start' : ''}">${row.fc(col)}</td>`;
        });
        html += `</tr>`;
      });

      dom.hourlyTable.innerHTML = html;

      // The table's width follows the window, so keep the box glued to its column on resize too.
      if (!hourlyResizeObserver && typeof ResizeObserver !== 'undefined') {
        hourlyResizeObserver = new ResizeObserver(positionHourlyActiveBox);
        hourlyResizeObserver.observe(dom.hourlyTable);
      }
      positionHourlyActiveBox();
      scrollHourlyActiveIntoView();
    }

    let hourlyResizeObserver = null;

    // The active column's cell in the Hour row (+1 skips the row-label <th>).
    function getActiveHourCell() {
      const row = dom.hourlyTable.querySelector('tr.hb-hour-row');
      return row ? row.cells[state.frameIdx + 1] : null;
    }

    // Draws the single blue box over the active hour's column, top to bottom of the whole
    // table, using the column's measured geometry (so it stays exact at fractional widths).
    function positionHourlyActiveBox() {
      const box = dom.hourlyActiveBox;
      const cell = getActiveHourCell();
      if (!cell) { box.style.display = 'none'; return; }
      const inner = box.parentElement.getBoundingClientRect();
      const table = dom.hourlyTable.getBoundingClientRect();
      const c = cell.getBoundingClientRect();
      box.style.left = `${c.left - inner.left}px`;
      box.style.top = `${table.top - inner.top}px`;
      box.style.width = `${c.width}px`;
      box.style.height = `${table.height}px`;
      box.style.display = 'block';
    }

    // Keeps the current hour on screen as playback advances (or the slider moves) by sliding
    // the table so the active column sits in the middle of the visible area, i.e. the part
    // not covered by the sticky label column. Does nothing when the whole table already fits.
    function scrollHourlyActiveIntoView() {
      const wrap = dom.hourlyWrap;
      const cell = getActiveHourCell();
      if (!cell || wrap.scrollWidth <= wrap.clientWidth) return;
      const labelPx = CONFIG.hourlyTable.labelColPx;
      const cellCenter = cell.getBoundingClientRect().left - dom.hourlyActiveBox.parentElement.getBoundingClientRect().left
                         + cell.getBoundingClientRect().width / 2;
      const target = cellCenter - (labelPx + (wrap.clientWidth - labelPx) / 2);
      wrap.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    }

    /* =========================================================================
       PLAYBACK CONTROLS
    ========================================================================= */
    function getPlaybackInterval() {
      return dom.speedSelect ? parseInt(dom.speedSelect.value) : CONFIG.defaultPlaybackMs;
    }

    // Clicking a column in the hourly table jumps straight to that hour, same as
    // scrubbing the slider — and, like scrubbing, stops any active playback.
    function jumpToFrame(idx) {
      pause();
      goToFrame(idx);
    }

    function goToFrame(idx) {
      state.frameIdx = Math.max(0, Math.min(state.frames.length - 1, idx));
      dom.timeSlider.value = state.frameIdx;
      renderCurrentFrame();
    }

    // Button labels for the Play/Pause toggle (same inline-SVG icons as the static buttons).
    const PLAY_BTN_HTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10l9-5z"/></svg> Play';
    const PAUSE_BTN_HTML = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10"/><rect x="9.5" y="3" width="3" height="10"/></svg> Pause';

    function togglePlay() { state.isPlaying ? pause() : play(); }

    function play() {
      state.isPlaying = true;
      dom.playBtn.innerHTML = PAUSE_BTN_HTML;
      if (state.playTimer) clearInterval(state.playTimer);

      state.playTimer = setInterval(() => {
        const nextIdx = state.frameIdx >= state.frames.length - 1 ? 0 : state.frameIdx + 1;
        goToFrame(nextIdx);
      }, getPlaybackInterval());
    }

    function pause() {
      state.isPlaying = false;
      dom.playBtn.innerHTML = PLAY_BTN_HTML;
      if (state.playTimer) clearInterval(state.playTimer);
    }

    function onSpeedChange() { if (state.isPlaying) play(); }

    function stepFrame(dir) {
      pause();
      goToFrame(state.frameIdx + dir);
    }

    function firstFrame() {
      pause();
      goToFrame(0);
    }

    function lastFrame() {
      pause();
      goToFrame(state.frames.length - 1);
    }

    function onSliderMove(val) {
      pause();
      goToFrame(parseInt(val));
    }

    /* =========================================================================
       INIT
    ========================================================================= */
    map = initMap();

    // Single source of truth for the on-page version tag: CONFIG.version (see the
    // header comment's CHANGELOG for what changed in each version).
    document.getElementById('versionTag').innerText = `v${CONFIG.version}`;

    // Once the person types their own End Date & Time, stop silently overwriting it
    // with "now" on every fetch — they're deliberately looking at a fixed window.
    dom.startDate.addEventListener('input', () => { state.autoEndDate = false; });

    // Violin checkbox redraws right away - no refetch needed.
    dom.violinToggle.addEventListener('change', () => renderCurrentFrame());

    window.onload = () => {
      fetchAndProcessData();
    };
  </script>
</body>
</html>
